name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feat/*
    paths-ignore:
      - README.md

jobs:
  # 🧩 1️⃣ Install Dependencies
  install-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          cd src/backend
          npm ci --omit=dev

  # ☁️ 2️⃣ Deploy Infrastructure
  deploy-infra:
    runs-on: ubuntu-latest
    needs: install-dependencies
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy Infrastructure with Bicep
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "🚀 Deploying infrastructure..."
            az deployment group create \
              --resource-group rg-bicep-tutorial \
              --template-file infra/main.bicep \
              --parameters @infra/parameters.json

  # 🔍 3️⃣ Validate Infra
  validate-infra:
    runs-on: ubuntu-latest
    needs: deploy-infra
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Validate Infrastructure
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "🔎 Validating infrastructure..."
            az deployment group validate \
              --resource-group rg-bicep-tutorial \
              --template-file infra/main.bicep \
              --parameters @infra/parameters.json

  # 🚀 4️⃣ Deploy Code
  deploy-code:
    runs-on: ubuntu-latest
    needs: validate-infra
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install dependencies
        run: |
          cd src/backend
          npm ci --omit=dev

      - name: Zip backend folder
        run: |
          cd src/backend
          zip -r ../../backend.zip .

      - name: Deploy backend to Azure Web App
        run: |
          echo "🚀 Deploying backend zip to Azure Web App..."
          az webapp deploy \
            --resource-group rg-bicep-tutorial \
            --name bicepTut-webapp-001 \
            --src-path ./backend.zip \
            --type zip
